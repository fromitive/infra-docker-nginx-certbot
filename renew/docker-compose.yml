services:
  nginx_for_cert:
    image: nginx
    container_name: nginx_for_cert
    ports:
      - "80:80"
    volumes:
      - ./certbot-webroot:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot-webroot:/var/www/html
      - ../certifications:/etc/letsencrypt

    command: ["renew", "--force-renewal"]
    depends_on:
      - nginx_for_cert